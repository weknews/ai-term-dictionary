# main에 push하면 발행 전 점검을 돌리고, 통과해야 GitHub Pages에 올린다.
# index.html + terms.js를 그대로 서빙한다 (빌드 불필요).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
      # 뉴스 목록(날짜 최신순)과 용어별 뉴스 색인(용어 카드의 "뉴스에 나온 일"). 저장소에 두면 날마다 PR끼리 충돌한다
      - run: |
          python3 - <<'EOF'
          import glob, json, os
          fs = sorted(glob.glob('news/20*.json'), reverse=True)
          json.dump([os.path.basename(f)[:10] for f in fs], open('news/index.json', 'w'))
          by = {}
          for f in fs:
              d = json.load(open(f))
              for i in d.get('items', []):
                  for t in i.get('terms') or []:
                      by.setdefault(t, []).append({'d': d['date'], 't': i['title']})
          json.dump(by, open('news/terms.json', 'w'), ensure_ascii=False)
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
