<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 늬우스</title>
<meta name="description" content="위뉴 AI 용어집이 평일 아침 내는 AI 뉴스레터. 개발자가 아니어도 AI 흐름을 따라갈 수 있게 쓴다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 색·서체는 index.html과 같은 값. 한쪽을 바꾸면 같이 바꾼다 */
:root{
  --paper:#F1EFE9; --paper-2:#E7E4DB; --card:#FBFAF7;
  --ink:#16233F; --muted:#5A6580;
  --pink:#E0234E; --yellow:#F0B400;
  --line:#16233F; --faint:rgba(22,35,63,.16); --faint-2:rgba(22,35,63,.07);
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1626; --paper-2:#172134; --card:#151F31;
    --ink:#EFEDE5; --muted:#98A3BA; --pink:#FF5C77; --yellow:#FFCA4A;
    --line:#EFEDE5; --faint:rgba(239,237,229,.2); --faint-2:rgba(239,237,229,.07);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1626; --paper-2:#172134; --card:#151F31;
  --ink:#EFEDE5; --muted:#98A3BA; --pink:#FF5C77; --yellow:#FFCA4A;
  --line:#EFEDE5; --faint:rgba(239,237,229,.2); --faint-2:rgba(239,237,229,.07);
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--body);
  font-size:17px; line-height:1.78; -webkit-font-smoothing:antialiased; word-break:keep-all}
.wrap{max-width:680px; margin:0 auto; padding-inline:20px}
a{color:var(--pink)}
h1,h2,h3{font-family:var(--display); font-weight:400; text-wrap:balance}

/* 머리말 */
.mast{padding-block:clamp(28px,5vw,48px) 20px; border-bottom:3px solid var(--line)}
.top{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
  font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:.12em}
.top a{text-decoration:none}
h1{margin:12px 0 4px; font-size:clamp(36px,8vw,56px); line-height:1.05; letter-spacing:-.02em}
.date{margin:0; font-size:15px; color:var(--muted)}

/* 헤드라인 + 세 가지 */
.headline{margin:28px 0 0; font-size:clamp(24px,4.6vw,32px); line-height:1.3}
.three{margin:22px 0 0; padding:20px 22px; background:var(--card); border:2px solid var(--faint)}
.three h2, .sec{font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:.14em;
  color:var(--muted); margin:0 0 12px}
.three ol{margin:0; padding:0; list-style:none; counter-reset:n}
.three li{counter-increment:n; position:relative; padding-left:34px; margin-top:10px}
.three li:first-child{margin-top:0}
.three li::before{content:counter(n); position:absolute; left:0; top:1px; font-family:var(--display);
  font-size:22px; line-height:1.2; color:var(--pink)}

/* 섹션 */
.sec{display:flex; align-items:center; gap:10px; margin:44px 0 0}
.sec::after{content:""; flex:1; height:2px; background:var(--faint)}
.kind{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.08em; color:var(--pink)}

/* 큰 소식 */
.big{padding-block:20px 6px}
.big + .big{border-top:2px solid var(--faint); margin-top:14px}
.big h3{margin:4px 0 10px; font-size:clamp(21px,3.8vw,26px); line-height:1.32}
.big p{margin:0}
.why{margin-top:14px!important; padding:12px 16px; background:var(--faint-2); border-left:4px solid var(--pink); font-size:15.5px}
.why b{font-weight:600}
.more{display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; margin-top:12px; font-size:14px}
.more .src{font-family:var(--mono); font-size:12.5px; text-decoration:none}
.more .src:hover{text-decoration:underline}
.chip{font-family:var(--mono); font-size:11.5px; text-decoration:none; color:var(--muted);
  border:1.5px solid var(--faint); padding:2px 8px}
.chip:hover{color:var(--ink); border-color:var(--line)}

/* 짧게 */
.shorts{margin:8px 0 0; padding:0; list-style:none}
.shorts li{padding-block:16px; border-bottom:2px solid var(--faint-2)}
.shorts li:last-child{border-bottom:0}
.shorts h4{margin:2px 0 4px; font-size:17.5px; font-weight:600; line-height:1.45}
.shorts p{margin:0; font-size:16px}
.shorts .why{background:none; padding:0 0 0 12px; border-left-width:3px; margin-top:6px!important; font-size:14.5px; color:var(--muted)}

/* 오늘의 용어 */
.term{margin-top:14px; padding:22px; border:3px solid var(--line); background:var(--card)}
.term .k{font-family:var(--display); font-size:26px; line-height:1.2}
.term .e{font-family:var(--mono); font-size:12.5px; color:var(--muted); margin-left:8px}
.term .def{margin:10px 0 0}
.term .ctx{margin:12px 0 0; font-size:15.5px; color:var(--muted)}
.term a{display:inline-block; margin-top:12px; font-family:var(--mono); font-size:12.5px; text-decoration:none}

.banner{margin-top:18px; background:var(--yellow); color:#16233F; padding:10px 14px;
  font-family:var(--mono); font-size:12.5px; font-weight:600}
.archive{margin-top:48px; font-size:14px}
.archive a{display:inline-block; margin:0 12px 8px 0; font-family:var(--mono); font-size:12.5px}
.archive a[aria-current]{color:var(--ink); font-weight:600; text-decoration:none}
.note{margin-top:28px; font-size:13.5px; color:var(--muted); line-height:1.7}
.empty{font-family:var(--mono); font-size:13px; color:var(--muted); padding:48px 0; text-align:center}
footer{margin-top:28px; border-top:3px solid var(--line); padding-block:18px 44px;
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="top"><span>WEKNEWS · 평일 아침</span><a href="./">위뉴 AI 용어집 →</a></div>
    <h1>오늘의 늬우스</h1>
    <p class="date" id="date">&nbsp;</p>
  </header>
  <main id="main"><p class="empty">불러오는 중…</p></main>
  <nav class="archive" id="archive"></nav>
  <p class="note">연구소 발표와 커뮤니티에서 AI 소식을 모아 원문만 보고 쓴다. 숫자는 원문과 대조하고, 사람이 읽어 본 뒤 발행한다. 회사가 발표한 수치는 그렇다고 적었다.</p>
  <footer>WEKNEWS · 오늘의 늬우스</footer>
</div>
<script src="terms.js" charset="utf-8"></script>
<script>
(function(){
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  var main = document.getElementById("main");
  var P = new URLSearchParams(location.search), want = P.get("d"), review = P.get("review");
  var TERMS = {}; (window.TERMS || []).forEach(function(t){ TERMS[t.k] = t; });
  var DAYS = ["일", "월", "화", "수", "목", "금", "토"];

  function kdate(s){
    var d = new Date(s + "T00:00:00");
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + DAYS[d.getDay()] + "요일";
  }
  function more(i){
    var h = '<div class="more"><a class="src" href="' + esc(i.url) + '" rel="noopener">원문 · ' + esc(i.source) + " ↗</a>";
    (i.terms || []).forEach(function(t){
      h += '<a class="chip" href="./?q=' + encodeURIComponent(t) + '#terms">' + esc(t) + "</a>"; });
    return h + "</div>";
  }

  function render(d){
    document.getElementById("date").textContent = kdate(d.date);
    document.title = "오늘의 늬우스 — " + d.date;
    var items = d.items || [];
    // 예전 형식(size 없음)은 첫 항목을 큰 소식으로 본다
    var big = items.filter(function(i){ return i.size === "big"; });
    if (!big.length) big = items.slice(0, 1);
    var short = items.filter(function(i){ return big.indexOf(i) < 0; });

    var h = '<h2 class="headline">' + esc(d.headline) + "</h2>";
    if (d.summary3 && d.summary3.length) {
      h += '<section class="three"><h2>오늘 알아둘 세 가지</h2><ol>' +
           d.summary3.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ol></section>";
    } else if (d.lede) {
      h += '<section class="three"><p style="margin:0">' + esc(d.lede) + "</p></section>";
    }

    h += '<h2 class="sec">큰 소식</h2>';
    big.forEach(function(i){
      h += '<article class="big"><span class="kind">' + esc(i.kind) + "</span><h3>" + esc(i.title) + "</h3><p>" +
           esc(i.summary) + '</p><p class="why"><b>왜 중요하냐면</b> ' + esc(i.why) + "</p>" + more(i) + "</article>";
    });

    if (short.length) {
      h += '<h2 class="sec">짧게</h2><ul class="shorts">';
      short.forEach(function(i){
        h += '<li><span class="kind">' + esc(i.kind) + "</span><h4>" + esc(i.title) + "</h4><p>" + esc(i.summary) +
             '</p><p class="why">' + esc(i.why) + "</p>" + more(i) + "</li>";
      });
      h += "</ul>";
    }

    var tod = d.term_of_day, t = tod && TERMS[tod.term];
    if (t) {
      h += '<h2 class="sec">오늘의 용어</h2><section class="term"><span class="k">' + esc(t.k) + '</span><span class="e">' +
           esc(t.e) + '</span><p class="def">' + esc(t.d) + '</p><p class="ctx">' + esc(tod.context) + "</p>" +
           '<a href="./?q=' + encodeURIComponent(t.k) + '#terms">용어집에서 더 보기 →</a></section>';
    }
    main.innerHTML = h;
  }

  // 로컬 검토: news/review.sh가 띄운다. 초안은 news/work/에만 있다(배포되지 않음)
  if (review) {
    fetch("news/work/final-" + review + ".json").then(function(r){ return r.json(); }).then(function(d){
      render(d);
      main.insertAdjacentHTML("afterbegin", '<p class="banner">검토용 초안 — 아직 발행 전이다. 원문 링크를 열어 해석이 맞는지 본다.</p>');
    }).catch(function(){ main.innerHTML = '<p class="empty">검토할 초안이 없다 (news/work/final-' + esc(review) + '.json)</p>'; });
    return;
  }

  // news/index.json은 배포할 때 Actions가 만든다 (날짜 파일 목록). 저장소에는 없다
  fetch("news/index.json").then(function(r){ return r.json(); }).then(function(dates){
    if (!dates.length) throw new Error("empty");
    var d = (want && dates.indexOf(want) > -1) ? want : dates[0];
    document.getElementById("archive").innerHTML = '<h2 class="sec">지난 호</h2>' + dates.slice(0, 60).map(function(x){
      return '<a href="?d=' + x + '"' + (x === d ? ' aria-current="page"' : "") + ">" + x + "</a>"; }).join("");
    return fetch("news/" + d + ".json").then(function(r){ return r.json(); }).then(render);
  }).catch(function(){
    main.innerHTML = '<p class="empty">아직 발행된 호가 없다.</p>';
  });
})();
</script>
</body>
</html>
